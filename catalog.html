<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Каталог — GLASSES SHOP UKRAINE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4eee5;
            color: #4f4035;
        }

        header {
            background: #e8dccb;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo img {
            width: 150px;
            max-height: 80px;
            object-fit: contain;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #4f4035;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .filters {
            background: #eadfce;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .filters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .filter-group label {
            font-weight: bold;
            font-size: 14px;
        }

        select,
        input {
            padding: 10px;
            border: 1px solid #cbbba5;
            border-radius: 8px;
            background: white;
            color: #4f4035;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #8d7863;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .product {
            background: #fffaf4;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(80, 60, 40, 0.12);
        }

        .product-image {
            width: 100%;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1e9dd;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product h2 {
            font-size: 20px;
            margin: 10px 0;
        }

        .product p {
            margin: 7px 0;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-top: 12px;
        }

        .product-link {
            display: inline-block;
            margin-top: 15px;
            color: #6f5a47;
            font-weight: bold;
            text-decoration: none;
        }

        .product-link:hover {
            text-decoration: underline;
        }

        #noProducts {
            display: none;
            text-align: center;
            font-size: 18px;
            padding: 40px;
        }

        @media (max-width: 600px) {
            header {
                justify-content: center;
            }

            nav {
                justify-content: center;
            }

            .container {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="index.html" class="logo">
        <img
            src="images/logo.jpg"
            alt="GLASSES SHOP UKRAINE"
        >
    </a>

    <nav>
        <a href="index.html">Головна</a>
        <a href="catalog.html">Каталог</a>
        <a href="index.html#about">Про нас</a>
        <a href="index.html#contacts">Контакти</a>
    </nav>

</header>


<main class="container">

    <h1>Каталог оправ</h1>


    <div class="filters">

        <div class="filters-row">

            <div class="filter-group">
                <label for="categoryFilter">Категорія</label>

                <select id="categoryFilter">
                    <option value="all">Усі оправи</option>
                    <option value="women">Жіночі оправи</option>
                    <option value="men">Чоловічі оправи</option>
                    <option value="children">Дитячі оправи</option>
                </select>
            </div>


            <div class="filter-group">
                <label for="brandFilter">Бренд</label>

                <select id="brandFilter">
                    <option value="all">Усі бренди</option>
                    <option value="Ovvio">Ovvio</option>
                    <option value="Di Marca">Di Marca</option>
                </select>
            </div>


            <div class="filter-group">
                <label for="shapeFilter">Форма</label>

                <select id="shapeFilter">
                    <option value="all">Усі форми</option>
                    <option value="Котяче око">Котяче око</option>
                    <option value="Кругла">Кругла</option>
                    <option value="Квадратна">Квадратна</option>
                    <option value="Прямокутна">Прямокутна</option>
                    <option value="Овальна">Овальна</option>
                    <option value="Авіатор">Авіатор</option>
                </select>
            </div>


            <div class="filter-group">
                <label for="minPrice">Ціна від</label>
                <input
                    type="number"
                    id="minPrice"
                    placeholder="0"
                >
            </div>


            <div class="filter-group">
                <label for="maxPrice">Ціна до</label>
                <input
                    type="number"
                    id="maxPrice"
                    placeholder="10000"
                >
            </div>


            <button id="filterButton">
                Застосувати
            </button>

        </div>

    </div>


    <div class="products">


        <!-- ОПРАВА 1 -->

        <article
            class="product"
            data-category="women"
            data-brand="Ovvio"
            data-shape="Котяче око"
            data-price="500"
        >

            <div class="product-image">

                <img
                    src="images/ovvio-1469-c3.jpg"
                    alt="Ovvio 1469 C3"
                >

            </div>

            <h2>Ovvio 1469 C3</h2>

            <p>
                <strong>Бренд:</strong> Ovvio
            </p>

            <p>
                <strong>Розмір:</strong> 54□18-142
            </p>

            <p>
                <strong>Категорія:</strong> Жіночі оправи
            </p>

            <p class="price">
                500 грн
            </p>

            <a
                href="product-ovvio-1469.html"
                class="product-link"
            >
                Детальніше →
            </a>

        </article>


        <!-- ОПРАВА 2 -->

        <article
            class="product"
            data-category="women"
            data-brand="Di Marca"
            data-shape="Котяче око"
            data-price="510"
        >

            <div class="product-image">

                <img
                    src="images/di marca p80161 c3.jpg"
                    alt="Di Marca P80161 C3"
                >

            </div>

            <h2>Di Marca P80161 C3</h2>

            <p>
                
                <strong>Бренд:</strong> Di Marca
            </p>
<p>
    <strong>Розмір:</strong> 54□17-144
            </p>
            <p>
                <strong>Категорія:</strong> Жіночі оправи
            </p>

            <p class="price">
                510 грн
            </p>

            <a
                href="product-di marca p80161 c3.html"
                class="product-link"
            >
                Детальніше →
            </a>

        </article>


    </div>


    <div id="noProducts">
        За заданими параметрами оправ не знайдено.
    </div>

</main>


<script>

    const categoryFilter =
        document.getElementById("categoryFilter");

    const brandFilter =
        document.getElementById("brandFilter");

    const shapeFilter =
        document.getElementById("shapeFilter");

    const minPrice =
        document.getElementById("minPrice");

    const maxPrice =
        document.getElementById("maxPrice");

    const filterButton =
        document.getElementById("filterButton");

    const products =
        document.querySelectorAll(".product");

    const noProducts =
        document.getElementById("noProducts");


    function filterProducts() {

        const category =
            categoryFilter.value;

        const brand =
            brandFilter.value;

        const shape =
            shapeFilter.value;


        const min =
            minPrice.value === ""
                ? 0
                : Number(minPrice.value);


        const max =
            maxPrice.value === ""
                ? Infinity
                : Number(maxPrice.value);


        let visibleProducts = 0;


        products.forEach(function(product) {

            const productCategory =
                product.dataset.category;

            const productBrand =
                product.dataset.brand;

            const productShape =
                product.dataset.shape;

            const productPrice =
                Number(product.dataset.price);


            const categoryMatch =
                category === "all" ||
                productCategory === category;


            const brandMatch =
                brand === "all" ||
                productBrand === brand;


            const shapeMatch =
                shape === "all" ||
                productShape === shape;


            const priceMatch =
                productPrice >= min &&
                productPrice <= max;


            if (
                categoryMatch &&
                brandMatch &&
                shapeMatch &&
                priceMatch
            ) {

                product.style.display = "block";

                visibleProducts++;

            } else {

                product.style.display = "none";

            }

        });


        if (visibleProducts === 0) {

            noProducts.style.display = "block";

        } else {

            noProducts.style.display = "none";

        }

    }


    filterButton.addEventListener(
        "click",
        filterProducts
    );


    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const categoryFromUrl =
        urlParams.get("category");


    if (
        categoryFromUrl === "women" ||
        categoryFromUrl === "men" ||
        categoryFromUrl === "children"
    ) {

        categoryFilter.value =
            categoryFromUrl;

    }


    filterProducts();

</script>

</body>
</html>
