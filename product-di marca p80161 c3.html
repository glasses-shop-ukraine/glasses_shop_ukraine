<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>Di Marca P80161 C3 — GLASSES SHOP UKRAINE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f2ec;
            color: #222;
        }

        header {
            background: #ebe7df;
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .logo span {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #222;
            font-size: 15px;
        }

        nav a:hover {
            opacity: 0.6;
        }

        .product {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }

        .gallery {
            text-align: center;
        }

        .main-photo {
            width: 100%;
            max-width: 520px;
            height: 520px;
            object-fit: contain;
            background: white;
            border-radius: 8px;
        }

        .thumbnails {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            object-fit: cover;
            background: white;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
        }

        .thumbnail.active {
            border-color: #222;
        }

        .info h1 {
            font-size: 32px;
            margin: 0 0 10px;
        }

        .brand {
            font-size: 18px;
            color: #777;
            margin-bottom: 20px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .characteristics {
            border-top: 1px solid #d8d3ca;
            margin-top: 20px;
        }

        .characteristic {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #d8d3ca;
            gap: 20px;
        }

        .characteristic span:first-child {
            color: #777;
        }

        .availability {
            margin-top: 25px;
            font-size: 16px;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #222;
            text-decoration: none;
        }

        footer {
            background: #ebe7df;
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            color: #555;
        }

        @media (max-width: 800px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
            }

            nav {
                gap: 15px;
            }

            .product {
                grid-template-columns: 1fr;
                margin-top: 35px;
                gap: 35px;
            }

            .main-photo {
                height: 400px;
            }
        }
    </style>
</head>

<body>
   <header>
    <div class="logo">
        <img src="images/logo.jpg" alt="GLASSES SHOP UKRAINE">
        <span>GLASSES SHOP UKRAINE</span>
    </div>

    <nav>
        <a href="index.html">Головна</a>
        <a href="catalog.html">Каталог</a>
        <a href="index.html#about">Про нас</a>
        <a href="index.html#contacts">Контакти</a>
    </nav>
</header>

<main class="product">

    <div class="gallery">

        <img
            id="mainPhoto"
            class="main-photo"
            src="images/di marca p80161 c3.jpg"
            alt="НАЗВА МОДЕЛІ"
        >

        <div class="thumbnails">

            <img
                class="thumbnail active"
                src="images/di marca p80161 c3.jpg"
                alt="Вид 1"
                onclick="changePhoto(this, 'images/di marca p80161 c3.jpg')"
            >

            <img
                class="thumbnail"
                src="images/di marca p80161 c3-2.jpg"
                alt="Вид 2"
                onclick="changePhoto(this, 'images/di marca p80161 c3-2.jpg')"
            >

            <img
                class="thumbnail"
                src="images/di marca p80161 c3-3.jpg"
                alt="Вид 3"
                onclick="changePhoto(this, 'images/di marca p80161 c3-3.jpg')"
            >

        </div>

    </div>

    <div class="info">

       <div class="brand">Di Marca</div>

<h1>P80161 C3</h1>


        <div class="price">510 грн</div>

        <div class="characteristics">

            <div class="characteristic">
                <span>Категорія</span>
                <strong>Жіночі оправи</strong>
            </div>

            <div class="characteristic">
                <span>Форма</span>
                <strong>Котяче око</strong>
            </div>

            <div class="characteristic">
                <span>Колір</span>
                <strong>чорний + коричневий</strong>
            </div>

            <div class="characteristic">
                <span>Розмір</span>
                <strong>54□17-144</strong>
            </div>

            <div class="characteristic">
                <span>Бренд</span>
                <strong>Di Marca</strong>
            </div>

        </div>

        <div class="availability">
            <strong>Наявність:</strong> є в наявності
        </div>

        <a href="#" class="button">Уточнити наявність</a>

        <br>

        <a href="catalog.html" class="back">
            ← Повернутися до каталогу
        </a>

    </div>

</main>

<footer>
    © 2026 GLASSES SHOP UKRAINE
</footer>

<script>
    function changePhoto(element, photo) {
        document.getElementById("mainPhoto").src = photo;

        document.querySelectorAll(".thumbnail").forEach(function(item) {
            item.classList.remove("active");
        });

        element.classList.add("active");
    }
</script>

</body>
</html>
