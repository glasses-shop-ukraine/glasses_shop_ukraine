<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Контактні лінзи — GLASSES SHOP UKRAINE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4eee5;
            color: #4f4035;
        }

        header {
            background: #e8dccb;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo img {
            width: 150px;
            max-height: 80px;
            object-fit: contain;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #4f4035;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            font-weight: 400;
            margin-bottom: 40px;
        }

       @media (max-width: 900px) {
    .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 600px) {
    .products {
        grid-template-columns: 1fr;
    }
}

        .product-card {
            display: block;
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
            padding: 22px;
            background: #fffaf4;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(80, 60, 40, 0.12);
            text-decoration: none;
            color: #4f4035;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(80, 60, 40, 0.18);
        }

        .product-image {
            width: 100%;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1e9dd;
            border-radius: 12px;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-name {
            font-size: 24px;
            font-weight: bold;
            margin: 18px 0 5px;
        }

        .product-brand {
            font-size: 14px;
            color: #8d7863;
            margin: 0 0 12px;
            letter-spacing: 1px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        .quantity {
            font-size: 15px;
            color: #8d7863;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            header {
                justify-content: center;
            }

            nav {
                justify-content: center;
            }

            .container {
                padding: 25px 15px;
            }

            h1 {
                font-size: 30px;
            }

            .product-card {
                padding: 15px;
            }

            .product-image {
                height: 220px;
            }
        }
        .products {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 25px;
}
        @media (max-width: 900px) {
    .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 600px) {
    .products {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>

<body>

            </div>

            <p class="product-brand">COMFORT LINE</p>

<a href="product-o2o2.html" class="product-card">

</html>
