<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ovvio 1266 C1 — GLASSES SHOP UKRAINE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4eee5;
            color: #4f4035;
        }

        header {
            background: #e8dccb;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo img {
            width: 150px;
            max-height: 80px;
            object-fit: contain;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #4f4035;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .product-page {
            background: #fffaf4;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(80, 60, 40, 0.12);
        }

        .photos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .photo {
            background: #f1e9dd;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
        }

        .photo img {
            width: 100%;
            height: 350px;
            object-fit: contain;
            display: block;
            transition: transform 0.3s;
        }

        .photo:hover img {
            transform: scale(1.03);
        }

        .info {
            text-align: center;
        }

        .info p {
            font-size: 18px;
            margin: 10px 0;
        }

        .price {
            font-size: 25px !important;
            font-weight: bold;
            margin-top: 20px !important;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #8d7863;
            color: white;
            border-radius: 8px;
            text-decoration: none;
        }

        @media (max-width: 650px) {
            .photos {
                grid-template-columns: 1fr;
            }

            .photo img {
                height: 300px;
            }

            header {
                justify-content: center;
            }

            nav {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

<header>

    <a href="index.html" class="logo">
        <img
            src="images/logo.jpg"
            alt="GLASSES SHOP UKRAINE"
        >
    </a>

    <nav>
        <a href="index.html">Головна</a>
        <a href="catalog.html">Каталог</a>
        <a href="index.html#about">Про нас</a>
        <a href="index.html#contacts">Контакти</a>
    </nav>

</header>


<main class="container">

    <div class="product-page">

        <h1>Ovvio 1266 C1</h1>


        <div class="photos">

            <div class="photo">
                <img
                    src="images/ovvio-1266-c1.jpg"
                    alt="Ovvio 1266 C1"
                    onclick="openPhoto(this.src)"
                >
            </div>


            <div class="photo">
                <img
                    src="images/ovvio-1266-c1-2.jpg"
                    alt="Ovvio 1266 C1 — друге фото"
                    onclick="openPhoto(this.src)"
                >
            </div>

        </div>


        <div class="info">

            <p>
                <strong>Бренд:</strong> Ovvio
            </p>

            <p>
                <strong>Розмір:</strong> 53□15-140
            </p>

            <p>
                <strong>Форма:</strong> Котяче око
            </p>

            <p>
                <strong>Категорія:</strong> Жіночі оправи
            </p>

            <p class="price">
                500 грн
            </p>

            <a href="catalog.html" class="back">
                ← Повернутися до каталогу
            </a>

        </div>

    </div>

</main>


<script>

    function openPhoto(src) {
        window.open(src, "_blank");
    }

</script>

</body>
</html>
