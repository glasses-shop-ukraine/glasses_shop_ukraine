<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ovvio 1266 C1 — GLASSES SHOP UKRAINE</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3eadf;
            color: #4b3a2f;
        }

        header {
            background: #e6d5c3;
            padding: 15px;
            text-align: center;
        }

        header img {
            width: 120px;
            max-width: 70%;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: #4b3a2f;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #fffaf5;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
        }

        .product-photo {
            text-align: center;
        }

        .main-photo {
            width: 100%;
            max-width: 500px;
            max-height: 500px;
            object-fit: contain;
            border-radius: 12px;
            cursor: pointer;
        }

        .thumbnails {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .thumbnail {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .thumbnail:hover {
            border-color: #a88b72;
        }

        .info {
            margin-top: 25px;
            font-size: 18px;
            line-height: 1.7;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #4b3a2f;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <img src="images/logo.jpg" alt="GLASSES SHOP UKRAINE">

    <nav>
        <a href="index.html">Головна</a>
        <a href="catalog.html">Каталог</a>
        <a href="about.html">Про нас</a>
        <a href="contacts.html">Контакти</a>
    </nav>
</header>

<div class="container">

    <h1>Ovvio 1266 C1</h1>

    <div class="product-photo">

        <img
            id="mainPhoto"
            class="main-photo"
            src="images/ovvio-1266-c1.jpg"
            alt="Ovvio 1266 C1"
            onclick="openPhoto(this.src)"
        >

        <div class="thumbnails">

            <img
                class="thumbnail"
                src="images/ovvio-1266-c1.jpg"
                alt="Ovvio 1266 C1"
                onclick="changePhoto(this.src)"
            >

            <img
                class="thumbnail"
                src="images/ovvio-1266-c1-2.jpg"
                alt="Ovvio 1266 C1 — вид збоку"
                onclick="changePhoto(this.src)"
            >

        </div>

    </div>

    <div class="info">

        <p>
            <strong>Бренд:</strong> Ovvio
        </p>

        <p>
            <strong>Модель:</strong> Ovvio 1266 C1
        </p>

        <p>
            <strong>Розмір:</strong> 53□15-140
        </p>

        <p>
            <strong>Форма:</strong> Котяче око
        </p>

        <p>
            <strong>Категорія:</strong> Жіночі оправи
        </p>

        <p class="price">
            500 грн
        </p>

    </div>

    <a class="back" href="catalog.html">
        ← Повернутися до каталогу
    </a>

</div>

<script>
    function changePhoto(photo) {
        document.getElementById("mainPhoto").src = photo;
    }

    function openPhoto(photo) {
        window.open(photo, "_blank");
    }
</script>

</body>
</html>
